apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ritucast-backend
  labels:
    cloud.google.com/location: asia-south1
    app: ritucast
    tier: backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle for minimal operating cost (DEC-09, ADR-07)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: ritucast-api-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/ritucast/backend:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DEBUG
              value: "false"
            - name: CORS_ORIGINS
              value: '["https://ritucast.app","https://www.ritucast.app"]'
            - name: DEFAULT_DANGER_LEVEL_M
              value: "8.25"
            - name: MAX_WEATHER_AGE_HOURS
              value: "36.0"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
