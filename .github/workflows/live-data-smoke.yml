name: Live Data Smoke Tests

on:
  schedule:
    # Run daily at 02:00 UTC (08:00 BST) before morning farming advisory window
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      notify_on_failure:
        description: 'Send alert on upstream provider outage'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read

jobs:
  upstream-smoke-tests:
    name: Live Provider Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Execute Live Smoke Tests (Open-Meteo & NASA POWER)
        id: smoke-test
        run: |
          echo "Starting live upstream smoke tests against external provider APIs..."
          pytest -m "smoke" -v --tb=short

      - name: Report External Provider Status
        if: failure()
        run: |
          echo "::warning::One or more upstream external data providers failed connectivity or schema checks."
          echo "Note: Routine deterministic CI on PRs remains unaffected."
