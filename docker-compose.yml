services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: ritucast-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","https://ritucast.app"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ritucast-net

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: ritucast-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ritucast-net

networks:
  ritucast-net:
    driver: bridge
